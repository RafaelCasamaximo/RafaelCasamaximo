<svg viewBox="0 0 900 320" width="900" height="320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Operational telemetry panel">
  <title>OPERATIONAL TELEMETRY — R. CASAMAXIMO</title>

  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3300"/>
      <stop offset="100%" stop-color="#ff8c1a"/>
    </linearGradient>

    <pattern id="gaps" width="9" height="16" patternUnits="userSpaceOnUse">
      <rect x="6" y="0" width="3" height="16" fill="#0d0d0d"/>
    </pattern>

    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="3" height="1" fill="#ff6600" opacity="0.05"/>
    </pattern>

    <radialGradient id="atGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>

    <style>
      .mono { font-family: 'Share Tech Mono', 'Courier New', ui-monospace, monospace; }
      .lbl  { fill: #ffb347; font-size: 12px; letter-spacing: 1.4px; }
      .val  { fill: #ff8c1a; font-size: 12px; letter-spacing: 1px; }
      .cap  { fill: #8a5a2b; font-size: 10px; letter-spacing: 2.6px; }
      .ttl  { fill: #ff6600; font-size: 15px; letter-spacing: 3.4px; }
      .ro   { fill: #a06a30; font-size: 10.5px; letter-spacing: 1.6px; }
      .roV  { fill: #ff6600; font-size: 10.5px; letter-spacing: 1.6px; }
    </style>
  </defs>

  <!-- frame -->
  <rect x="0" y="0" width="900" height="320" fill="#0d0d0d"/>
  <rect x="1.5" y="1.5" width="897" height="317" fill="none" stroke="#ff6600" stroke-opacity="0.35"/>

  <!-- corner brackets -->
  <g stroke="#ff6600" stroke-width="2" fill="none">
    <path d="M10 30 L10 10 L44 10"/>
    <path d="M856 10 L890 10 L890 30"/>
    <path d="M10 290 L10 310 L44 310"/>
    <path d="M890 290 L890 310 L856 310"/>
  </g>

  <!-- header -->
  <g class="mono">
    <text x="30" y="30" class="ttl">OPERATIONAL TELEMETRY</text>
    <circle cx="806" cy="25" r="4" fill="#ff6600">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <text x="870" y="29" class="val" text-anchor="end">極秘 // LIVE FEED</text>
  </g>
  <line x1="0" y1="45" x2="900" y2="45" stroke="#ff6600" stroke-opacity="0.35"/>
  <line x1="574" y1="45" x2="574" y2="320" stroke="#ff6600" stroke-opacity="0.22"/>

  <!-- ================= LEFT: operation distribution ================= -->
  <g class="mono">
    <text x="30" y="70" class="cap">OPERATION DISTRIBUTION // 任務分布</text>

    <!-- bar 1 -->
    <text x="30" y="105" class="lbl">EMBEDDED / RTOS</text>
    <rect x="220" y="92" width="274" height="16" fill="#1c1210"/>
    <rect x="220" y="92" height="16" fill="url(#barGrad)" width="0">
      <animate attributeName="width" from="0" to="274" dur="1.1s" begin="0.1s" fill="freeze"/>
    </rect>
    <rect x="220" y="92" width="274" height="16" fill="url(#gaps)"/>
    <text x="510" y="105" class="val">32%</text>

    <!-- bar 2 -->
    <text x="30" y="139" class="lbl">FRONTEND / UI</text>
    <rect x="220" y="126" width="274" height="16" fill="#1c1210"/>
    <rect x="220" y="126" height="16" fill="url(#barGrad)" width="0">
      <animate attributeName="width" from="0" to="206" dur="1.1s" begin="0.2s" fill="freeze"/>
    </rect>
    <rect x="220" y="126" width="274" height="16" fill="url(#gaps)"/>
    <text x="510" y="139" class="val">24%</text>

    <!-- bar 3 -->
    <text x="30" y="173" class="lbl">HARDWARE / PCB</text>
    <rect x="220" y="160" width="274" height="16" fill="#1c1210"/>
    <rect x="220" y="160" height="16" fill="url(#barGrad)" width="0">
      <animate attributeName="width" from="0" to="137" dur="1.1s" begin="0.3s" fill="freeze"/>
    </rect>
    <rect x="220" y="160" width="274" height="16" fill="url(#gaps)"/>
    <text x="510" y="173" class="val">16%</text>

    <!-- bar 4 -->
    <text x="30" y="207" class="lbl">BACKEND / DATA</text>
    <rect x="220" y="194" width="274" height="16" fill="#1c1210"/>
    <rect x="220" y="194" height="16" fill="url(#barGrad)" width="0">
      <animate attributeName="width" from="0" to="103" dur="1.1s" begin="0.4s" fill="freeze"/>
    </rect>
    <rect x="220" y="194" width="274" height="16" fill="url(#gaps)"/>
    <text x="510" y="207" class="val">12%</text>

    <!-- bar 5 -->
    <text x="30" y="241" class="lbl">COMPUTER VISION</text>
    <rect x="220" y="228" width="274" height="16" fill="#1c1210"/>
    <rect x="220" y="228" height="16" fill="url(#barGrad)" width="0">
      <animate attributeName="width" from="0" to="77" dur="1.1s" begin="0.5s" fill="freeze"/>
    </rect>
    <rect x="220" y="228" width="274" height="16" fill="url(#gaps)"/>
    <text x="510" y="241" class="val">9%</text>

    <!-- bar 6 -->
    <text x="30" y="275" class="lbl">TOOLING / LINUX</text>
    <rect x="220" y="262" width="274" height="16" fill="#1c1210"/>
    <rect x="220" y="262" height="16" fill="url(#barGrad)" width="0">
      <animate attributeName="width" from="0" to="60" dur="1.1s" begin="0.6s" fill="freeze"/>
    </rect>
    <rect x="220" y="262" width="274" height="16" fill="url(#gaps)"/>
    <text x="510" y="275" class="val">7%</text>

    <text x="30" y="302" class="cap">SOURCE: CLASSIFIED OPS UNIT · PAYLOAD WITHHELD</text>
  </g>

  <!-- ================= RIGHT: A.T. field ================= -->
  <g class="mono">
    <text x="737" y="70" class="cap" text-anchor="middle">A.T. FIELD // 絶対恐怖領域</text>
  </g>

  <circle cx="737" cy="158" r="90" fill="url(#atGlow)"/>

  <circle cx="737" cy="158" r="86" fill="none" stroke="#ff6600" stroke-opacity="0.5"
          stroke-width="1" stroke-dasharray="5 11">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 737 158" to="360 737 158" dur="24s" repeatCount="indefinite"/>
  </circle>

  <polygon points="737,86 799,122 799,194 737,230 675,194 675,122"
           fill="none" stroke="#ff6600" stroke-opacity="0.85" stroke-width="1.6"/>
  <polygon points="737,112 777,135 777,181 737,204 697,181 697,135"
           fill="#ff6600" fill-opacity="0.07" stroke="#ff8c1a" stroke-opacity="0.55" stroke-width="1"/>

  <g stroke="#ff6600" stroke-opacity="0.25" stroke-width="1">
    <line x1="737" y1="86" x2="737" y2="230"/>
    <line x1="675" y1="122" x2="799" y2="194"/>
    <line x1="799" y1="122" x2="675" y2="194"/>
  </g>

  <g class="mono" text-anchor="middle">
    <text x="737" y="155" fill="#ff6600" font-size="21" letter-spacing="2">A.T.</text>
    <text x="737" y="175" fill="#ffb347" font-size="10" letter-spacing="3.6">FIELD</text>
  </g>

  <g class="mono">
    <text x="612" y="262" class="ro">REPOSITORIES</text>
    <text x="862" y="262" class="roV" text-anchor="end">SEALED</text>
    <line x1="612" y1="270" x2="862" y2="270" stroke="#ff6600" stroke-opacity="0.15"/>

    <text x="612" y="288" class="ro">COMMIT SIGNATURE</text>
    <text x="862" y="288" class="roV" text-anchor="end">PUBLIC</text>
    <line x1="612" y1="296" x2="862" y2="296" stroke="#ff6600" stroke-opacity="0.15"/>

    <text x="612" y="312" class="ro">PATTERN</text>
    <text x="862" y="312" class="roV" text-anchor="end">ORANGE</text>
  </g>

  <!-- scanlines on top -->
  <rect x="0" y="0" width="900" height="320" fill="url(#scan)"/>
</svg>
